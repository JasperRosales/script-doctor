name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach builds to
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleRelease
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cp composeApp/build/outputs/apk/release/composeApp-release.apk "ScriptDoctor-${TAG}-android.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Script Doctor ${TAG}" --generate-notes
          gh release upload "$TAG" "ScriptDoctor-${TAG}-android.apk" --clobber

